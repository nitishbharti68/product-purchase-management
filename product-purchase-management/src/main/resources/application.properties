spring.application.name=product-purchase-management

# ---------- Server ----------
server.port=${SERVER_PORT:8080}

# ---------- Database ----------
# Local defaults are used on your laptop.
# On AWS, these are replaced by environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_purchase_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Flyway ----------
spring.flyway.enabled=true

# ---------- JWT ----------
# The default is for local development only.
# Production MUST set JWT_SECRET (at least 32 characters).
jwt.secret=${JWT_SECRET:ProductPurchaseManagementSecureJwtKey2026ForDevelopmentOnly}
jwt.expiration=${JWT_EXPIRATION:1800000}

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false